<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - Visco</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="contenedor-principal">
        <aside class="barra-lateral">
            <div class="perfil-usuario">
                <div class="avatar">MA</div>
                <h3>Mauricio A.</h3>
                <p>Pasante IT</p>
            </div>
            <nav class="menu-navegacion">
                <a href="#" onclick="cambiarSeccion('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Panel de Control</a>
                <a href="#" onclick="cambiarSeccion('inventario', this)" class="activo"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a>
                <a href="#" onclick="cambiarSeccion('actas', this)"><i class="fa-solid fa-file-invoice"></i> Actas de Entrega</a>
                <a href="#" onclick="cambiarSeccion('ordenes', this)"><i class="fa-solid fa-cart-shopping"></i> Órdenes de Compra</a>
                <a href="#" onclick="cambiarSeccion('config', this)"><i class="fa-solid fa-gear"></i> Configuración</a>
            </nav>
           <button class="boton-salir" onclick="window.location.href='login.html'">
                <i class="fa-solid fa-right-from-bracket"></i> 
                Cerrar Sesión
           </button>
        </aside>

        <main class="area-trabajo">
            <header class="barra-superior">
                <div class="caja-busqueda">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar por FMO, Serial o Marca...">
                </div>
                <div class="iconos-notificacion">
                    <i class="fa-solid fa-moon"></i>
                    <i class="fa-solid fa-bell"></i>
                </div>
            </header>

            <section id="contenedor-dinamico">
                <div class="contenedor-tabla">
                    <div class="encabezado-tabla">
                        <h2>Listado de Equipos Telemáticos</h2>
                        <div class="filtros-fecha">
                            <input type="date" value="2026-04-10">
                            <span>al</span>
                            <input type="date" value="2026-04-10">
                        </div>
                    </div>
                    <div class="pestanas">
                        <button class="pestana activa">Todos</button>
                        <button class="pestana">Operativos</button>
                        <button class="pestana">Dañados</button>
                        <button class="pestana">En Reparación</button>
                    </div>
                    <table class="tabla-datos">
                        <thead>
                            <tr>
                                <th>N°</th>
                                <th>FMO</th>
                                <th>Clase</th>
                                <th>Marca / Serial</th>
                                <th>CECO</th>
                                <th>Descripción CECO</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td><strong>109440</strong></td>
                                <td>PC</td>
                                <td>DELL / 5H28DK3</td>
                                <td>21020301</td>
                                <td>PLANIFICACIÓN Y CONTROL</td>
                                <td><span class="etiqueta-estado operativo">Operativo</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="motor_navegacion.js"></script>
</body>
</html>
