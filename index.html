<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - Visco</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="contenedor-principal">
        <aside class="barra-lateral">
            <div class="perfil-usuario">
                <div class="avatar">MA</div>
                <h3>Mauricio A.</h3>
                <p>Pasante IT</p>
            </div>
            <nav class="menu-navegacion">
                <a href="#" onclick="cambiarSeccion('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Panel de Control</a>
                <a href="#" onclick="cambiarSeccion('registro', this)"><i class="fa-solid fa-circle-plus"></i> Registrar Equipo</a>
                <a href="#" onclick="cambiarSeccion('inventario', this)" class="activo"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a>
                <a href="#" onclick="cambiarSeccion('actas', this)"><i class="fa-solid fa-file-invoice"></i> Actas de Entrega</a>
                <a href="#" onclick="cambiarSeccion('config', this)"><i class="fa-solid fa-gear"></i> Configuración</a>
            </nav>
           <button class="boton-salir" onclick="window.location.href='login.html'">
                <i class="fa-solid fa-right-from-bracket"></i> 
                Cerrar Sesión
           </button>
        </aside>

        <main class="area-trabajo">
            <header class="barra-superior">
                <div class="titulo-pagina">
                    <h2 id="titulo-seccion"></h2>
                </div>
                <div class="iconos-notificacion">
                    <i class="fa-solid fa-moon" title="Modo Oscuro"></i>
                    <i class="fa-solid fa-bell" title="Notificaciones"></i>
                </div>
            </header>

            <section id="contenedor-dinamico">
                <div class="contenedor-cargando">
                </div>
            </section>
        </main>
    </div>
    <script src="motor_navegacion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</body>
</html>

<div id="modal-reporte" class="modal-fondo" style="display: none;">
    <div class="modal-contenido">
        <h3>Seleccionar Filtros para Reporte</h3>
        <select id="pdf-gerencia" onchange="actualizarDeptosModal()">
            <option value="">Seleccione Gerencia...</option>
        </select>
        <select id="pdf-depto">
            <option value="">Seleccione Departamento...</option>
        </select>
        <div class="modal-acciones">
            <button onclick="cerrarModal()" class="btn-cancelar">Cancelar</button>
            <button onclick="ejecutarGeneracionPDF()" class="btn-confirmar">Generar PDF</button>
        </div>
    </div>
</div>
