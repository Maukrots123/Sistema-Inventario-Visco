<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - Visco</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
    window.usuarioRol = 'usuario';
    window.usuarioNombre = 'Usuario';

    // Realizamos la petición al backend de Visco
    fetch('/api/verificar-sesion')
        .then(res => {
            if (!res.ok) throw new Error('No autorizado');
            return res.json();
        })
        .then(data => {
            if (data.debeCambiarClave) {
                window.location.href = 'login.html';
                return;
            }
            window.usuarioRol = data.rol || 'usuario';
            window.usuarioNombre = data.usuario_nombre || data.username || 'Usuario';

            // Procesar las iniciales del Avatar
            const avatar = window.usuarioNombre
                .split(/[^a-zA-Z0-9]+/)
                .filter(Boolean)
                .map(part => part[0].toUpperCase())
                .slice(0, 2)
                .join('') || 'US';

            // ASIGNACIÓN DIRECTA: Modificamos el DOM inmediatamente al recibir la respuesta
            const avatarEl = document.getElementById('avatar-perfil');
            const nombreEl = document.getElementById('perfil-usuario');
            const rolEl = document.getElementById('perfil-rol');

            if (avatarEl) avatarEl.innerText = avatar;
            if (nombreEl) nombreEl.innerText = window.usuarioNombre;
            if (rolEl) rolEl.innerText = window.usuarioRol;
        })
        .catch(err => {
            console.error("Sesión inválida:", err);
            window.location.href = 'login.html';
        });
</script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="contenedor-principal">
        <aside class="barra-lateral">
            <div class="perfil-usuario">
                <div class="avatar" id="avatar-perfil">US</div>
                <h3 id="perfil-usuario">Usuario</h3>
                <p id="perfil-rol">Invitado</p>
            </div>
            <nav class="menu-navegacion">
                <a href="#" onclick="cambiarSeccion('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Panel de Control</a>
                <a href="#" onclick="cambiarSeccion('registro', this)"><i class="fa-solid fa-circle-plus"></i> Registrar Equipo</a>
                <a href="#" onclick="cambiarSeccion('inventario', this)" class="activo"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a>
                <a href="#" onclick="cambiarSeccion('config', this)"><i class="fa-solid fa-gear"></i> Configuración</a>
            </nav>
           <button class="btn-dark-mode" onclick="toggleDarkMode()">
                 <i class="fa-solid fa-moon"></i>
                 <span id="dark-mode-text">Modo Oscuro</span>
            </button>
           <button class="boton-salir" href="#" onclick="cambiarSeccion('cerrar_sesion', this)">
                 <i class="fa-solid fa-right-from-bracket"></i> 
                 Cerrar Sesión
            </button>
        </aside>

        <main class="area-trabajo">
            <header class="barra-superior">
                <div class="titulo-pagina">
                    <h2 id="titulo-seccion"></h2>
                </div>
            </header>

            <section id="contenedor-dinamico">
                <div class="contenedor-cargando">
                </div>
            </section>
        </main>
    </div>
    
    <script src="motor_navegacion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                const icon = document.querySelector('.btn-dark-mode i');
                const text = document.getElementById('dark-mode-text');
                if (icon) icon.className = 'fa-solid fa-sun';
                if (text) text.textContent = 'Modo Claro';
            }
        });

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            const icon = document.querySelector('.btn-dark-mode i');
            const text = document.getElementById('dark-mode-text');
            if (icon) icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            if (text) text.textContent = isDark ? 'Modo Claro' : 'Modo Oscuro';
            if (window.chartBarras) {
                const c = isDark ? '#374151' : '#e2e8f0';
                const t = isDark ? '#9ca3af' : '#64748b';
                window.chartBarras.options.scales.x.grid.color = c;
                window.chartBarras.options.scales.y.grid.color = c;
                window.chartBarras.options.scales.x.ticks.color = t;
                window.chartBarras.options.scales.y.ticks.color = t;
                window.chartBarras.update();
            }
        }
    </script>
</body>
</html>

<div id="modal-reporte" class="modal-fondo" style="display: none;">
    <div class="modal-contenido">
        <h3><i class="fa-solid fa-sliders" style="margin-right:10px;color:#3b82f6;"></i>Filtrar y Exportar Reporte</h3>
        <select id="pdf-gerencia" onchange="actualizarDeptosModal()">
            <option value="">Seleccione Gerencia...</option>
        </select>
        <select id="pdf-depto">
            <option value="">Seleccione Departamento...</option>
        </select>
        <div class="modal-acciones">
            <button onclick="cerrarModal()" class="btn-cancelar"><i class="fa-solid fa-times"></i> Cancelar</button>
            <button onclick="ejecutarGeneracionPDF()" class="btn-confirmar"><i class="fa-solid fa-file-pdf"></i> PDF</button>
            <button onclick="ejecutarGeneracionExcel()" class="btn-confirmar btn-excel"><i class="fa-solid fa-file-excel"></i> Excel</button>
        </div>
    </div>
</div>
