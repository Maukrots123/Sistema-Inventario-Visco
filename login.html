<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema de Inventario Visco</title>
    <link rel="stylesheet" href="estilo_2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="contenedor-login">
        <div class="tarjeta-login">
            <div class="encabezado-login">
                <div class="logo-circulo">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <h1>Bienvenido</h1>
                <p>Ingresa tus credenciales para acceder al sistema de inventario.</p>
            </div>

            <div id="mensaje-error" style="display: none; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px; border-radius: 5px; margin-bottom: 20px; font-size: 0.9rem; text-align: left;">
                <i class="fa-solid fa-circle-exclamation" style="margin-right: 8px;"></i>
                <span id="texto-error">Usuario o contraseña incorrectos.</span>
            </div>

            <form class="formulario-acceso" id="form-login">
                <div class="grupo-entrada">
                    <label for="usuario">Usuario o Correo</label>
                    <div class="campo-icono">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="usuario" placeholder="Ej: mauricio.a" required>
                    </div>
                </div>

                <div class="grupo-entrada">
                    <label for="clave">Contraseña</label>
                    <div class="campo-icono">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="clave" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="opciones-secundarias">
                    <label class="recordarme">
                        <input type="checkbox" id="recordarme"> Recordar sesión
                    </label>
                    <a href="#" class="olvido-clave">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="boton-entrar">
                    Entrar al Sistema
                </button>
            </form>

            <footer class="pie-login">
                <p>&copy; 2026 Control de Inventario FMO</p>
            </footer>
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }
        });
    </script>
</body>
</html>
